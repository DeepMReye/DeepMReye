---
# Documentation
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
-   package-ecosystem: github-actions
    directory: /
    schedule:
        interval: semiannually
    groups:
        github-actions:
            patterns: ['*']

# updates uv.lock (and pyproject.toml if a new version is outside the allowed range)
-   package-ecosystem: uv
    directory: /
    schedule:
        interval: semiannually
    groups:
        python-dependencies:
            patterns: ['*']
