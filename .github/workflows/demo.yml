---
name: test notebooks

# this aims to test the notebooks, the way the user would
# - install the package with the dependencies needed to run the notebooks
# - use the nbmake pytest plugin to run the notebooks from top to bottom

#

on:
    push:
        branches: [main]
    pull_request:
        branches: ['*']

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    test_notebooks:

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macOS-latest]
                python-version: ['3.11']
                notebook: [usage_pretrained_weights]

        runs-on: ${{ matrix.os }}

        steps:

        -   name: Clone repo
            uses: actions/checkout@v6

        -   name: Get data from OSF
            run: cd notebooks && make all

        -   name: Set up uv and Python ${{ matrix.python-version }}
            uses: astral-sh/setup-uv@v10
            with:
                python-version: ${{ matrix.python-version }}
                enable-cache: true

        -   name: Install deepmreye and dependencies
            run: uv sync --locked --group demo --extra notebooks

        -   name: Display Python version and packages
            run: |
                uv run --no-sync python -c "import sys; print(sys.version)"
                uv pip list

        -   name: Run notebook ${{ matrix.notebook }}
            run: uv run --no-sync pytest -s --nbmake --nbmake-timeout=3000 "./notebooks/deepmreye_example_${{ matrix.notebook }}.ipynb"
