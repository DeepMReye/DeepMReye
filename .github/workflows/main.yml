---
name: Test

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:

    build:
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest] # MacOS fails to run at all # windows-latest: does not work because antspyx is not available for windows
                python-version: ['3.11', '3.12']
                resolution: [locked]
                include:
                # oldest supported python with the minimum versions of the dependencies
                -   os: ubuntu-latest
                    python-version: '3.11'
                    resolution: lowest-direct
        runs-on: ${{ matrix.os }}
        steps:
        -   uses: actions/checkout@v6
        -   name: Set up uv and Python ${{ matrix.python-version }}
            uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
            with:
                python-version: ${{ matrix.python-version }}
                enable-cache: true
        -   name: Install dependencies (locked)
            if: matrix.resolution == 'locked'
            run: uv sync --locked --no-default-groups --group test
        -   name: Install dependencies (minimum versions)
            if: matrix.resolution == 'lowest-direct'
            run: uv sync --resolution lowest-direct --no-default-groups --group test
        -   name: Display installed packages
            run: uv pip list
        -   name: Test with pytest
            run: uv run --no-sync pytest
