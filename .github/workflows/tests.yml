name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the published release on the Hub is checked even when nothing changes here.
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # hatch-vcs reads the version from the tags
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" flake8
      - name: Lint
        run: python -m flake8 deepmreye scripts
      - name: Test
        run: python -m pytest deepmreye/tests -q

  release:
    # The published decoder, through this code, on a published participant.
    name: published release (Hub)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_type == 'tag'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        env:
          DEEPMREYE_NETWORK_TESTS: "1"
          # The corpus is gated: a token of an account that accepted its terms.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python -m pytest deepmreye/tests -q -m network
