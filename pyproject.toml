[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [{name = " Markus Frey", email = "markus.frey1@gmail.com"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3"
]
dependencies = [
    # Evaluation: pure numpy/sklearn, no GPU and no deep-learning stack.
    "numpy",
    "scipy",
    "scikit-learn",
    "h5py",
    "pandas",
    "joblib",
    # Ingestion: S3, coregistration, gaze parsing, QA images.
    "antspyx",
    "nibabel",
    "boto3",
    "requests",
    "tqdm",
    "eyelinkio>=0.3.0",
    "pillow",
    "plotly",
    # QA labeling UI, and the HuggingFace mirror of the corpus.
    "flask",
    "huggingface-hub",
]
description = "MR-based eye tracker without eye tracking"
dynamic = ["version"]
license = {file = "LICENSE"}
maintainers = [{name = " Markus Frey", email = "markus.frey1@gmail.com"}]
name = "deepmreye"
readme = "README.md"
requires-python = ">=3.9.0,<3.12"

[project.optional-dependencies]
test = ["pytest>6", "pytest-cov"]

[project.urls]
home = "https://github.com/DeepMReye/DeepMReye"

[tool.black]
line-length = 120

[tool.codespell]
builtin = "clear,rare"
ignore-words-list = "ags,bu,fo,fro,nd,no,noe,ot,slite,te,vas,woh,yhe,joO"
skip = "*.html"

[tool.hatch.build.hooks.vcs]
version-file = "deepmreye/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["deepmreye"]

[tool.hatch.version]
source = "vcs"

[tool.isort]
combine_as_imports = true
line_length = 120
profile = "black"
skip_gitignore = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --showlocals --durations=5"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
junit_family = "xunit2"
log_cli_level = "INFO"
minversion = "6.0"
testpaths = ["deepmreye/tests"]
xfail_strict = true
