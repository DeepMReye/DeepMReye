[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[project]
authors = [{name = " Markus Frey", email = "markus.frey1@gmail.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3"
]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "h5py",
    # Registration of a new run to the template (preprocess / decode).
    "antspyx",
    # The pretrained decoder and the published corpus.
    "huggingface-hub",
    # The QA image of a registration.
    "pillow",
]
description = "Decode eye gaze from fMRI without an eye tracker"
dynamic = ["version"]
license = {file = "LICENSE"}
maintainers = [{name = " Markus Frey", email = "markus.frey1@gmail.com"}]
name = "deepmreye"
readme = "README.md"
requires-python = ">=3.9.0,<3.12"

[project.optional-dependencies]
test = ["pytest>6", "pytest-cov"]

[project.scripts]
deepmreye = "deepmreye.__main__:main"

[project.urls]
home = "https://github.com/DeepMReye/DeepMReye"

[tool.black]
line-length = 120

[tool.codespell]
builtin = "clear,rare"
ignore-words-list = "ags,bu,fo,fro,nd,no,noe,ot,slite,te,vas,woh,yhe,joO"
skip = "*.html"

[tool.hatch.build.hooks.vcs]
version-file = "deepmreye/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["deepmreye"]

[tool.hatch.version]
source = "vcs"

[tool.isort]
combine_as_imports = true
line_length = 120
profile = "black"
skip_gitignore = true

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --showlocals --durations=5"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
junit_family = "xunit2"
log_cli_level = "INFO"
minversion = "6.0"
testpaths = ["deepmreye/tests"]
xfail_strict = true

[tool.uv]
# antspyx 0.6.3 pins scipy<1.16, and the scipy 1.15 wheels no longer load on
# macOS 27 (dyld rejects `_spropack`), which takes scikit-learn down with them.
# Nothing here uses the part of scipy that antspyx pins against. An override
# replaces every declaration of the package, so the second entry restates
# antspyx's pin wherever the first does not apply -- Linux resolves as before.
override-dependencies = [
    "scipy>=1.17; sys_platform == 'darwin' and python_version >= '3.11'",
    "scipy<1.16; sys_platform != 'darwin' or python_version < '3.11'",
]
