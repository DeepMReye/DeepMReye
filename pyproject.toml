[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "hatch-vcs"]

[dependency-groups]
# run the example notebooks as tests (see .github/workflows/demo.yml)
# use with the "notebooks" extra: uv sync --group demo --extra notebooks
demo = ["nbmake>=1.5.0", "pytest>=9.0.0"]
dev = [
    { include-group = "doc" },
    { include-group = "style" },
    { include-group = "test" }
]
doc = [
    "sphinx>=7.0.0",
    "sphinx-argparse>=0.4.0",
    "sphinx-rtd-theme>=2.0.0"
]
docs = [{ include-group = "doc" }]
style = ["tox>=4.0.0"]
test = ["pytest>=9.0.0", "pytest-cov>=6.0.0"]
tests = [{ include-group = "test" }]

[project]
authors = [{ name = " Markus Frey", email = "markus.frey1@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "antspyx>=0.4.2",
    "numpy>=1.23.5",
    "pandas>=1.5.0",
    "plotly>=5.0.0",
    "scikit-learn>=1.1.3",
    "scipy>=1.9.2",
    "tensorflow>=2.15.0",
    "tf-keras>=2.15.0"
]
description = "MR-based eye tracker without eye tracking"
dynamic = ["version"]
license = { file = "LICENSE" }
maintainers = [{ name = " Markus Frey", email = "markus.frey1@gmail.com" }]
name = "deepmreye"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
# needed to run the example notebooks in jupyter
notebooks = [
    "anywidget>=0.9.0",
    "ipywidgets>=7.0.0",
    "nbformat>=4.2.0"
]
streamlit = ["streamlit>=1.30.0"]

[project.urls]
home = "https://github.com/DeepMReye/DeepMReye"

[tool.codespell]
builtin = "clear,rare"
ignore-words-list = "ags,bu,fo,fro,nd,no,noe,ot,slite,te,vas,woh,yhe,joO"
skip = "*.html"

[tool.hatch.build.hooks.vcs]
version-file = "deepmreye/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["deepmreye"]

[tool.hatch.version]
source = "vcs"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers --doctest-modules --showlocals -s -vv --durations=0"
doctest_optionflags = "NORMALIZE_WHITESPACE ELLIPSIS"
junit_family = "xunit2"
log_cli_level = "INFO"
minversion = "9.0"
testpaths = ["tests"]
xfail_strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
exclude = ["media"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "E722",
    # adding strict= to zip() could change behavior
    "B905"
]
select = ["B", "C90", "D", "E", "F", "I", "W"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.mccabe]
max-complexity = 11

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = ["E501", "F401"]
"*/__init__.py" = ["F401"]

[tool.ruff.lint.pydocstyle]
convention = "pep257"
